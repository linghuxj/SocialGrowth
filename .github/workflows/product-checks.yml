name: Product checks

on:
  pull_request:
    paths:
      - ".github/workflows/product-checks.yml"
      - "scripts/verify-product-core-loop-local.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "product/**"
      - "docs/engineering/delivery/**"
      - "memory.md"
      - "scripts/run-playwright-target.mjs"
      - "scripts/verify-product-web-readiness.mts"
  push:
    branches: [main, codex/core-automation-loop-stage1]
    paths:
      - ".github/workflows/product-checks.yml"
      - "scripts/verify-product-core-loop-local.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "product/**"
      - "docs/engineering/delivery/**"
      - "memory.md"
      - "scripts/run-playwright-target.mjs"
      - "scripts/verify-product-web-readiness.mts"

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 8.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:product
      - run: pnpm lint:product
      - run: pnpm test:product
      - run: pnpm build:product
      - run: docker compose --env-file product/deploy/.env.product.example -f product/deploy/compose.product.yml config --quiet
      - run: python3 docs/engineering/delivery/check_consistency.py
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify the built product Web through Playwright
        env:
          SG_PRODUCT_CORE_BROWSER_ADMITTED: "1"
          SG_PRODUCT_CORE_SCOPES: identity
          SG_PRODUCT_CORE_WEB_MODE: preview
          SG_PRODUCT_CORE_OUTPUT: artifacts/acceptance/ci-identity
        run: |
          docker pull postgres:17.11
          docker pull minio/minio:RELEASE.2024-01-11T07-46-16Z
          pnpm exec node scripts/verify-product-core-loop-local.mjs

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Require the checked-in Gradle wrapper
        run: test -x product/android/gradlew
      - run: product/android/gradlew -p product/android clean assembleDebug --no-daemon
